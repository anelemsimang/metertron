<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" role="img" aria-label="Before paper and WhatsApp versus Metertron flow">
  <rect width="800" height="320" fill="#F7FAF8"/>
  <text x="180" y="36" text-anchor="middle" fill="#6B7C72" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Before</text>
  <text x="620" y="36" text-anchor="middle" fill="#147A45" font-family="system-ui,sans-serif" font-size="14" font-weight="600">With Metertron</text>
  <rect x="40" y="56" width="280" height="220" rx="12" fill="#fff" stroke="#D7E2DB"/>
  <rect x="70" y="80" width="90" height="120" rx="6" fill="#EEE8DA" stroke="#C9BFA8"/>
  <text x="115" y="145" text-anchor="middle" fill="#7A6F58" font-size="11" font-family="system-ui,sans-serif">Job card</text>
  <rect x="190" y="90" width="100" height="160" rx="14" fill="#1C1C1C"/>
  <rect x="200" y="105" width="80" height="120" rx="6" fill="#25D366" opacity="0.85"/>
